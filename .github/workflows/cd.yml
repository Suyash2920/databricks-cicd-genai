# =============================================================================
# CD - runs when code is merged (pushed) to main.
#
#   CI  ->  Deploy QA (qa_catalog)  ->  [manual approval]  ->  Deploy PROD (prod_catalog)
#                                                               |
#                         GenAI release notes / deployment report / docs
#                         Slack or Teams notification
# =============================================================================
name: CD - Deploy Databricks ETL (QA to PROD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Never run two deployments at the same time; queue them instead.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      notify: false
    secrets:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      OLLAMA_USERNAME: ${{ secrets.OLLAMA_USERNAME }}
      OLLAMA_PASSWORD: ${{ secrets.OLLAMA_PASSWORD }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  deploy-qa:
    name: QA
    needs: ci
    uses: ./.github/workflows/reusable-databricks-deploy.yml
    with:
      target: qa
      environment: qa
    secrets:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

  deploy-prod:
    name: PROD
    # PROD only runs after QA succeeded (and after approval on the "prod" environment).
    needs: deploy-qa
    uses: ./.github/workflows/reusable-databricks-deploy.yml
    with:
      target: prod
      environment: prod
    secrets:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

  ai-release-report:
    name: GenAI - Release Notes, Deployment Report and Docs
    needs:
      - deploy-qa
      - deploy-prod
    if: always() && vars.ENABLE_AI == 'true' && needs.deploy-qa.result != 'skipped'
    runs-on: ${{ vars.AI_PROVIDER == 'ollama' && 'self-hosted' || 'ubuntu-latest' }}
    continue-on-error: true
    timeout-minutes: 30
    env:
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      OLLAMA_URLS: ${{ vars.OLLAMA_URLS }}
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
      OLLAMA_USERNAME: ${{ secrets.OLLAMA_USERNAME }}
      OLLAMA_PASSWORD: ${{ secrets.OLLAMA_PASSWORD }}
    steps:
      - name: Checkout code (full history for release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all pipeline logs
        uses: actions/download-artifact@v4
        with:
          pattern: logs-*
          path: downloaded_logs
          merge-multiple: true

      # PYTHON_CMD (e.g. "py") applies only to the Windows self-hosted runner used for Ollama.
      - name: Check AI connectivity
        continue-on-error: true
        run: ${{ vars.AI_PROVIDER == 'ollama' && vars.PYTHON_CMD || 'python' }} scripts/ai_assistant.py check

      - name: AI - Release notes / changelog
        run: >-
          ${{ vars.AI_PROVIDER == 'ollama' && vars.PYTHON_CMD || 'python' }} scripts/ai_assistant.py release-notes
          --max-commits 20
          --output ai_reports/release_notes.md

      - name: AI - Deployment report (log summary)
        run: >-
          ${{ vars.AI_PROVIDER == 'ollama' && vars.PYTHON_CMD || 'python' }} scripts/ai_assistant.py summarize-logs
          --input-dir downloaded_logs
          --title "Deployment Report (QA and PROD)"
          --output ai_reports/deployment_report.md

      - name: AI - Pipeline documentation
        run: >-
          ${{ vars.AI_PROVIDER == 'ollama' && vars.PYTHON_CMD || 'python' }} scripts/ai_assistant.py generate-docs
          --output ai_reports/pipeline_documentation.md

      - name: Upload AI reports
        uses: actions/upload-artifact@v4
        with:
          name: ai-reports-release
          path: ai_reports/
          retention-days: 30

  notify:
    name: Notify Teams / Slack
    needs:
      - ci
      - deploy-qa
      - deploy-prod
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Send pipeline result
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_RESULT: ${{ needs.ci.result }}
          QA_RESULT: ${{ needs.deploy-qa.result }}
          PROD_RESULT: ${{ needs.deploy-prod.result }}
        run: >-
          python scripts/notify.py --title "CD - Deploy Databricks ETL (QA to PROD)"
          --result "CI=$CI_RESULT"
          --result "QA=$QA_RESULT"
          --result "PROD=$PROD_RESULT"
